services:
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/myhak/film-react-nest-frontend:latest
    volumes:
      - frontend_dist:/usr/share/nginx/html
    restart: no

  backend:
    build:
      context: ./backend
    image: ghcr.io/myhak/film-react-nest-backend:latest
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - film_network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/myhak/film-react-nest-nginx:latest
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - film_network
    restart: unless-stopped

  postgres:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - film_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - film_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film_network:
    driver: bridge
