services:
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/myhak/film-react-nest-frontend:latest
    volumes:
      - frontend_dist:/usr/share/nginx/html

  backend:
    build:
      context: ./backend
    image: ghcr.io/myhak/film-react-nest-backend:latest
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${POSTGRES_DB:-films}
      NODE_ENV: production
      LOG_FORMAT: json
    depends_on:
      - postgres
    networks:
      - film_network

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/myhak/film-react-nest-nginx:latest
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - film_network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-films}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - film_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - film_network

volumes:
  postgres_data:
  pgadmin_data:
  frontend_dist:

networks:
  film_network:
    driver: bridge
